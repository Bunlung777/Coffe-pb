# ============================================================================
# vhost ฉบับเต็มของ cpr-one.com — เพิ่ม Coffee Cost Report เข้าไปแล้ว
#
# ของเดิมไม่ถูกแตะเลย มีแต่ "เพิ่ม" 3 จุด ซึ่งทำเครื่องหมาย [+ COFFEE] ไว้
#
# วิธีใช้:
#   1) sudo cp /etc/apache2/sites-available/<ไฟล์เดิม>.conf \
#              /etc/apache2/sites-available/<ไฟล์เดิม>.conf.bak-$(date +%F)
#   2) เอาเนื้อหาไฟล์นี้ไปทับไฟล์เดิม (หรือ copy เฉพาะส่วน [+ COFFEE])
#   3) sudo a2enmod proxy proxy_http headers
#   4) sudo apache2ctl configtest      <-- ต้องขึ้น Syntax OK เท่านั้น
#   5) sudo systemctl reload apache2
# ============================================================================

<VirtualHost *:443>
    ServerName cpr-one.com
    ServerAlias www.cpr-one.com www-dev.cpr-one.com *.elb.amazonaws.com

    DocumentRoot "/var/www/html"
    <Directory "/var/www/html">
        AllowOverride All
    </Directory>


    RewriteEngine On

    # If the host is EXACTLY cpr-one.com (missing www), patch it:
    RewriteCond %{HTTP_HOST} ^cpr-one\.com$ [NC]
    RewriteRule ^(.*)$ https://www.cpr-one.com$1 [R=301,L]
    # RedirectMatch 302 ^/$ /cpr-one/view/auth/login.php
    RedirectMatch ^/phpMyAdmin$ /phpMyAdmin/
    <Location /phpMyAdmin/>
        ProxyPass http://127.0.0.1:8080/
        ProxyPassReverse http://127.0.0.1:8080/
        ProxyPassReverseCookiePath / /phpMyAdmin/
    </Location>


    SSLEngine on
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /home/ubuntu/certfile_2026/fullchain.pem
    SSLCertificateKeyFile /home/ubuntu/certfile_2026/_.cpr-one.com.key
    SSLCertificateChainFile /home/ubuntu/certfile_2026/DigiCertCA.crt
    SSLCipherSuite ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4:!DHE

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    # deny Laravel repo root (so only /public can ever be served)
    <Directory "/var/www/html/customer-centric/api">
        Require all denied
    </Directory>

    # map /customer-centric/api -> .../api/public (Laravel .htaccess handles rewrites)
    Alias "/customer-centric/api" "/var/www/html/customer-centric/api/public"
    <Directory "/var/www/html/customer-centric/api/public">
        Require all granted
    </Directory>

    # deny Laravel repo root (ป้องกันไม่ให้เข้าถึง source โดยตรง)
    <Directory "/var/www/html/test-cprweb/web">
        Require all denied
    </Directory>

    # map /test-cprweb -> .../web/public
    Alias "/test-cprweb" "/var/www/html/test-cprweb/web/public"

    <Directory "/var/www/html/test-cprweb/web/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # deny SlimPHP repo root (so only /public can ever be served)
    <Directory "/var/www/html/capex/api">
        Require all denied
    </Directory>

    # map /capex/api -> .../api/public (SlimPHP .htaccess handles rewrites)
    Alias "/capex/api" "/var/www/html/capex/api/public"
    <Directory "/var/www/html/capex/api/public">
        Require all granted
    </Directory>

    Alias "/bud/api" "/var/www/html/bud/api/public"
    <Directory "/var/www/html/bud/api/public">
        Require all granted
        AllowOverride All
    </Directory>


    Alias "/technician_pm/ui" "/var/www/html/technician_pm/ui"
      <Directory "/var/www/html/technician_pm/ui">
          Require all granted
          AllowOverride All
          RewriteEngine On
          RewriteBase /technician_pm/ui/
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
      </Directory>


    # ==================== [+ COFFEE] 1/3 — proxy ทาง HTTPS ====================
    # Coffee Cost Report เป็น Next.js (Node) ไม่ใช่ไฟล์ static จึงใช้ Alias
    # ไม่ได้ ต้อง ProxyPass เหมือน /phpMyAdmin ข้างบน
    #
    # ห้ามใส่ / ปิดท้ายทั้งสองฝั่ง — ถ้าใส่ Apache จะตัด prefix ทิ้ง แล้ว
    # /coffee-cost-report/_next/static/... จะ 404 หมด (หน้าเว็บโหลดแต่ไม่มี CSS)
    ProxyPass        /coffee-cost-report http://127.0.0.1:3001/coffee-cost-report timeout=300 connectiontimeout=10
    ProxyPassReverse /coffee-cost-report http://127.0.0.1:3001/coffee-cost-report

    <Location /coffee-cost-report>
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port  "443"
        LimitRequestBody 104857600
        Require all granted
    </Location>

    # ============== [+ COFFEE] 2/3 — กัน source code รั่ว ==============
    # source อยู่ใน DocumentRoot (/var/www/html/coffee-cost-report/...)
    # ปกติ ProxyPass รับ request ไปก่อนเสมอ Apache จึงไม่มีโอกาสเสิร์ฟไฟล์
    # ในโฟลเดอร์นี้ — บล็อกนี้เป็นตาข่ายชั้นสอง เผื่อวันหลัง ProxyPass ถูก
    # แก้หรือถอดออก จะได้ 403 แทนที่จะโชว์ source กับ .git
    #
    # (หลักการเดียวกับ Require all denied ของ /capex/api ข้างบน)
    <Directory "/var/www/html/coffee-cost-report">
        Require all denied
    </Directory>

</VirtualHost>


  <VirtualHost *:80>
      ServerName cpr-one.com
      ServerAlias www.cpr-one.com www-dev.cpr-one.com *.elb.amazonaws.com
      DocumentRoot "/var/www/html"
      <Directory "/var/www/html">
        AllowOverride All
        Require all granted
      </Directory>

      <Directory "/var/www/html/loader">
          AllowOverride All
          Require all granted
      </Directory>
      RewriteEngine On
      RewriteCond %{REQUEST_URI} !^/loader/
      #RewriteRule ^(.*)$ https://www.cpr-one.com$1 [R=301,L]

    # ============ [+ COFFEE] 3/3 — proxy ทาง HTTP (สำคัญที่สุด) ============
    # นี่คือบล็อกที่ทำให้ใช้งานได้จริง: CloudFront terminate TLS ที่ edge
    # แล้วคุยกับ origin ด้วย HTTP port 80 request จากผู้ใช้จริงจึงตกที่
    # vhost นี้ ไม่ใช่ *:443 (ที่เทสด้วย curl บนเครื่อง server ผ่านเพราะ
    # ยิงเข้า 443 ตรงๆ) และ redirect ไป HTTPS ในบล็อกนี้ถูก comment ไว้
    # ถ้าไม่มี ProxyPass ตรงนี้ Apache จะพยายามเสิร์ฟโฟลเดอร์ source เป็น
    # static แล้ว error ออกไปเป็นหน้า 222 byte ของ CloudFront
    #
    # RewriteCond/RewriteRule ข้างบนไม่ชนกับ ProxyPass เพราะ RewriteRule
    # ถูก comment ไว้ (ถ้าวันหลังเปิดใช้ ต้องเพิ่ม RewriteCond ยกเว้น
    # ^/coffee-cost-report ด้วย ไม่งั้นจะ redirect วนก่อนถึง proxy)
    ProxyPass        /coffee-cost-report http://127.0.0.1:3001/coffee-cost-report timeout=300 connectiontimeout=10
    ProxyPassReverse /coffee-cost-report http://127.0.0.1:3001/coffee-cost-report

    <Location /coffee-cost-report>
        ProxyPreserveHost On
        # ตั้ง https แม้อยู่ใน vhost port 80 — เพราะผู้ใช้เข้ามาทาง https
        # จริงที่ CloudFront ถ้าตั้ง http เวลา Next.js redirect จะเด้งเป็น
        # http:// แล้วเบราว์เซอร์บล็อกเป็น mixed content
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port  "443"
        LimitRequestBody 104857600
        Require all granted
    </Location>

  </VirtualHost>
