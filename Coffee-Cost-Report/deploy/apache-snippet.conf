# ============================================================================
# Coffee Cost Report — Apache config
#
# แทรกใน <VirtualHost *:443> ของ cpr-one.com (บล็อก *:443 อย่างเดียวพอ)
#
# ต่างจากแอปย่อยตัวอื่น: ตัวนี้ไม่ใช้ Alias เพราะไม่ใช่ไฟล์ static —
# เป็น Node server จึงต้อง ProxyPass เหมือน /phpMyAdmin
# ============================================================================

    # --- Coffee Cost Report (Next.js on 127.0.0.1:3001) ---------------------

    # ProxyPass ต้องส่ง path เต็มรวม prefix ไปด้วย (ไม่ strip) เพราะแอปตั้ง
    # basePath = "/coffee-cost-report" ไว้ใน next.config.ts แล้ว
    #
    # ห้ามใส่ / ปิดท้ายทั้งสองฝั่ง — ถ้าใส่จะกลายเป็น strip prefix แล้ว
    # /_next/static/... จะ 404 ทั้งหมด (หน้าเว็บโหลดแต่ไม่มี CSS)
    ProxyPass        /coffee-cost-report http://127.0.0.1:3001/coffee-cost-report timeout=300 connectiontimeout=10
    ProxyPassReverse /coffee-cost-report http://127.0.0.1:3001/coffee-cost-report

    <Location /coffee-cost-report>
        ProxyPreserveHost On

        # Next.js ใช้ header พวกนี้ประกอบ absolute URL เวลา redirect
        # ถ้าไม่ตั้ง redirect จะเด้งกลับมาเป็น http:// แล้ว mixed content
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port  "443"

        # จำกัดขนาดไฟล์อัปโหลดที่ 100 MB
        # (ไฟล์ MB51 จริงเล็กกว่านี้มาก ตั้งไว้กัน POST ใหญ่ผิดปกติ)
        LimitRequestBody 104857600

        Require all granted
    </Location>

    # source code อยู่ใน DocumentRoot (/var/www/html/coffee-cost-report/...)
    # ปกติ ProxyPass จะรับ request ก่อนเสมอ Apache จึงไม่มีโอกาสเสิร์ฟไฟล์
    # ในโฟลเดอร์นี้อยู่แล้ว — บล็อกนี้เป็นตาข่ายกันพลาดชั้นที่สอง เผื่อวันหลัง
    # ProxyPass ถูกแก้/ถอดออก จะได้ 403 แทนที่จะโชว์ source, .git, .env
    #
    # (หลักการเดียวกับ Require all denied ของ /capex/api และ /test-cprweb/web
    #  ที่มีอยู่แล้วในไฟล์นี้)
    <Directory "/var/www/html/coffee-cost-report">
        Require all denied
    </Directory>
